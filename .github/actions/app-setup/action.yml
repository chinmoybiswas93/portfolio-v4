name: App setup
description: PHP 8.3, cached Composer and npm dependencies, optional asset build and a throwaway .env. Shared by CI and the quality checks. Check out the repository first.

inputs:
  coverage:
    description: PHP coverage driver (none or pcov)
    required: false
    default: none
  build-assets:
    description: Run npm run build
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: '8.3'
        extensions: mbstring, intl, gd, bcmath, pdo_mysql, zip, exif, fileinfo
        coverage: ${{ inputs.coverage }}
        tools: composer:v2

    - name: Cache Composer packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.composer/cache/files
        key: composer-${{ hashFiles('composer.lock') }}
        restore-keys: composer-

    - name: Install PHP dependencies
      shell: bash
      run: composer install --no-interaction --prefer-dist --no-progress

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: npm

    - name: Install npm packages and build assets
      shell: bash
      run: |
        npm ci --no-fund --no-audit
        if [ "${{ inputs.build-assets }}" = "true" ]; then npm run build; fi

    - name: Prepare environment
      shell: bash
      run: |
        cp .env.example .env
        php artisan key:generate
        php artisan passport:keys --force # OAuth signing keys for the MCP tests (throwaway, CI only)
