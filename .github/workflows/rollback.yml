name: Rollback

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release id to switch back to (leave empty for the previous release)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-refs/heads/main
  cancel-in-progress: false

jobs:
  rollback:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions

      - uses: ./.github/actions/ssh-setup
        with:
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          user: ${{ secrets.SSH_USER }}

      - name: Switch release
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          TARGET: ${{ inputs.release }}
        run: |
          case "$TARGET" in *[!A-Za-z0-9-]*) echo "Invalid release id"; exit 1 ;; esac
          ssh target "bash -s" -- "$DEPLOY_PATH" "$TARGET" <<'REMOTE'
          set -euo pipefail
          APP="$HOME/$1"; TARGET="${2:-}"
          cd "$APP"
          CURRENT="$(basename "$(readlink current)")"
          if [ -z "$TARGET" ]; then
            TARGET="$(ls -1t releases | grep -v -x "$CURRENT" | head -n 1)"
          fi
          [ -n "$TARGET" ] && [ -d "releases/$TARGET" ] || { echo "Release not found"; exit 1; }
          ln -sfn "releases/$TARGET" current.new && mv -Tf current.new current
          echo "current -> releases/$TARGET (was $CURRENT)"
          REMOTE

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key
