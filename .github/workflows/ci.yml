name: CI

on:
  pull_request:
    branches: [development, main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: testing
          MARIADB_USER: testing
          MARIADB_PASSWORD: testing
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      # root of the throwaway service container: parallel Pest creates one database per process
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, bcmath, pdo_mysql, zip, exif, fileinfo
          coverage: pcov
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install and build front-end assets
        run: |
          npm ci --no-fund --no-audit
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan passport:keys --force # OAuth signing keys for the MCP tests (throwaway, CI only)

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Pest (MariaDB)
        run: vendor/bin/pest --parallel --testsuite=Unit,Feature

      - name: Mutation testing (invoice maths, min 90%)
        run: vendor/bin/pest tests/Unit/Invoicing --mutate --min=90

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke and accessibility tests
        run: vendor/bin/pest --testsuite=Browser

      - name: Asset budgets (gzip)
        run: scripts/asset-budgets.sh

      - name: Lighthouse CI (mobile, 3 runs)
        run: scripts/lighthouse.sh

      - name: Keep Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          retention-days: 14
          if-no-files-found: ignore

      - name: Dependency audit
        run: |
          composer audit --no-dev --abandoned=ignore
          npm audit --omit=dev --audit-level=high
