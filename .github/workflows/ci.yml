name: CI

# One CI run per pull request into main. Slow checks (coverage, mutation, Lighthouse) live in quality.yml.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docs-only pull requests skip the heavy job. A skipped job still counts as passing for a required check,
  # which a workflow-level paths-ignore would not (the check would stay pending and block the merge).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qvE '^(docs/|.*\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: ci
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: testing
          MARIADB_USER: testing
          MARIADB_PASSWORD: testing
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      # root of the throwaway service container: parallel Pest creates one database per process
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/app-setup

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Pest (MariaDB)
        run: vendor/bin/pest --parallel --testsuite=Unit,Feature

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke and accessibility tests
        run: vendor/bin/pest --testsuite=Browser

      - name: Asset budgets (gzip)
        run: scripts/asset-budgets.sh

      - name: Dependency audit
        run: |
          composer audit --no-dev --abandoned=ignore
          npm audit --omit=dev --audit-level=high
